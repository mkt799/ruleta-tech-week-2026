<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24275e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ruleta Kunan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ Identidad Kunan (manual de marca) ============ */
:root {
  --navy: #24275e; --blue: #3f529c; --green: #8bb51d; --lime: #b1c81f; --white: #ffffff; --gray: #343434;
  /* Tonos de apoyo tomados del brochure */
  --card: #dfe5f8;      /* fondo de tarjetas */
  --card-line: #c5cff0; /* borde de tarjetas */
  --pattern: #eff0f4;   /* líneas de la K de fondo */
  --navy-deep: #191b45; --green-deep: #6f9216; --wrong: #d9473d;
  --f-title: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--white); }
body { font-family: var(--f-body); color: var(--navy); background: var(--white); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--lime); outline-offset: 3px; }

/* Fondo: trazos grandes del isotipo, como en el brochure */
.bg { position: fixed; inset: 0; pointer-events: none; }
.bg svg { width: 100%; height: 100%; }

/* ============ Pantalla principal (vertical) ============ */
.app { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 3vh 1vw 4vh; }
.top { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 3vw; }
.logo-btn { background: none; border: 0; padding: 4px; }
.logo-btn img { height: clamp(36px, 4.2vh, 56px); display: block; }
/* Logo de Huawei como partner: misma altura visual, separado por una línea fina */
.partner { margin-right: auto; margin-left: clamp(14px, 2vw, 26px); padding-left: clamp(14px, 2vw, 26px); border-left: 2px solid var(--card-line); display: flex; align-items: center; }
.partner img { height: clamp(46px, 5.4vh, 72px); display: block; }
.status { display: flex; align-items: center; gap: 12px; font-size: clamp(14px, 1.5vh, 17px); color: #5d6390; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.status.off .dot { background: #e9a23b; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--card-line); background: var(--card); display: grid; place-items: center; }
.round svg { width: 24px; height: 24px; fill: var(--navy); }
.headline { text-align: center; margin-top: 2.4vh; }
.headline h1 { font-family: var(--f-title); font-weight: 800; font-size: clamp(30px, 3.6vh, 50px); line-height: 1; letter-spacing: -.02em; margin: 0; color: var(--navy); }
.headline p { margin: 1vh 0 0; font-size: clamp(17px, 1.9vh, 24px); color: var(--navy); opacity: .8; }

.wheel-zone { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 1.6vh 0 2.6vh; }
.wheel { height: 100%; max-height: 98vw; aspect-ratio: 1; position: relative; touch-action: none; }
.wheel svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 14px 22px rgba(36,39,94,.18)); }
.wheel .bulb { fill: #fff; opacity: .45; }
.wheel.spin .bulb { animation: bulb .5s linear infinite; animation-delay: calc(var(--i) * -.05s); }
.wheel.idle .bulb { animation: bulb 2.4s linear infinite; animation-delay: calc(var(--i) * -.24s); }
@keyframes bulb { 0%,100% { opacity: .4; } 10% { opacity: 1; } 40% { opacity: .4; } }
.wheel .ptr { transform-box: view-box; transform-origin: 300px 30px; }
.wheel .ptr.flick { animation: flick .13s ease-out; }
@keyframes flick { 40% { transform: rotate(-16deg); } }
.wheel .win-slice { animation: glow .8s ease-in-out 3; }
@keyframes glow { 50% { filter: brightness(1.25); } }
.slice-label { font-family: var(--f-title); font-weight: 700; }

.btn3d { border: 0; font-family: var(--f-title); font-weight: 700; letter-spacing: -.01em; transition: transform .08s, box-shadow .08s; }
.btn3d:active { transform: translateY(5px); }
.btn-spin { width: min(38vw, 290px); min-height: clamp(54px, 5.4vh, 72px); border-radius: 18px; font-size: clamp(22px, 2.6vh, 34px); background: var(--navy); color: #fff; box-shadow: 0 8px 0 var(--navy-deep), 0 18px 30px rgba(36,39,94,.22); }
.btn-spin:active { box-shadow: 0 3px 0 var(--navy-deep); }
.btn-spin[disabled] { opacity: .45; }
.hint { margin: 1.6vh 0 0; color: #5d6390; font-size: clamp(15px, 1.6vh, 19px); }

/* Categoría elegida */
.reveal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.reveal-card { width: min(76vw, 540px); border-radius: 32px; padding: 5vh 4vw; text-align: center; background: var(--white); border: 2px solid var(--card-line); box-shadow: 0 24px 60px rgba(36,39,94,.18); animation: bounceIn .5s cubic-bezier(.2,1.4,.4,1); }
.reveal-card .ico { width: clamp(110px, 12vh, 160px); height: clamp(110px, 12vh, 160px); margin: 0 auto 2.4vh; border-radius: 50%; background: var(--c); display: grid; place-items: center; }
.reveal-card .ico svg { width: 56%; height: 56%; }
.reveal-card small { display: block; font-size: clamp(20px, 2.2vh, 28px); color: #5d6390; }
.reveal-card strong { display: block; font-family: var(--f-title); font-weight: 800; font-size: clamp(42px, 5.4vh, 76px); line-height: 1.05; letter-spacing: -.02em; margin-top: .6vh; color: var(--navy); }
@keyframes bounceIn { from { transform: scale(.4); opacity: 0; } }

/* ============ Pregunta ============ */
.screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: calc(4vh + env(safe-area-inset-top, 0px)) 8vw calc(6vh + env(safe-area-inset-bottom, 0px)); gap: 3.6vh; background: var(--white); }
.screen > .bg { z-index: -1; }
.q-head { display: flex; align-items: center; gap: 3vw; }
.q-pill { display: inline-flex; align-items: center; gap: 12px; padding: 8px 24px 8px 8px; border-radius: 999px; background: var(--c); color: var(--ink); font-family: var(--f-title); font-weight: 700; font-size: clamp(21px, 2.4vh, 32px); }
.q-pill i { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; }
.q-pill i svg { width: 28px; height: 28px; }
.timer { margin-left: auto; position: relative; width: clamp(78px, 8.5vh, 112px); height: clamp(78px, 8.5vh, 112px); }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .track { stroke: var(--card); }
.timer .bar { stroke: var(--navy); transition: stroke-dashoffset .1s linear; }
.timer.low .bar { stroke: var(--wrong); }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-title); font-weight: 700; font-size: clamp(28px, 3.3vh, 42px); color: var(--navy); }
.q-card { flex: 0 0 auto; width: 100%; max-width: 980px; align-self: center; min-height: 0; margin-top: auto; background: var(--card); border: 2px solid var(--card-line); border-radius: 32px; padding: 3.6vh 5vw; display: flex; align-items: center; justify-content: center; text-align: center; animation: popUp .4s cubic-bezier(.2,1.3,.4,1); }
.q-card h2 { font-family: var(--f-title); font-weight: 800; font-size: clamp(32px, 3.8vh, 52px); line-height: 1.15; letter-spacing: -.015em; margin: 0; max-width: 20ch; color: var(--navy); }
@keyframes popUp { from { transform: translateY(30px); opacity: 0; } }
.answers { display: grid; gap: 2.4vh; margin-bottom: auto; width: 100%; max-width: 980px; align-self: center; }
/* La pregunta usa todo el ancho del recuadro */
#question .q-card h2 { max-width: none; width: 100%; }
/* Textos largos: la letra se achica sola para que todo entre */
.q-card h2.long { font-size: clamp(27px, 3.1vh, 42px); max-width: 28ch; }
.q-card h2.xlong { font-size: clamp(23px, 2.6vh, 34px); max-width: 34ch; line-height: 1.2; }
.answers.long .ans { font-size: clamp(19px, 2.1vh, 27px); }
.answers.xlong { gap: 1.8vh; }
.answers.xlong .ans { font-size: clamp(17px, 1.8vh, 23px); line-height: 1.25; }
.answer-box.long { font-size: clamp(24px, 2.8vh, 36px); line-height: 1.2; max-width: 90%; }
.ans { display: flex; align-items: center; gap: 3vw; width: 100%; text-align: left; border: 2px solid var(--card-line); border-radius: 24px; min-height: clamp(74px, 8vh, 108px); padding: 1vh 4vw 1vh 1.4vw; background: var(--white); color: var(--navy); font-family: var(--f-body); font-weight: 600; font-size: clamp(21px, 2.4vh, 32px); line-height: 1.2; box-shadow: 0 6px 0 var(--card); transition: transform .08s, box-shadow .08s, background-color .2s, border-color .2s, opacity .25s; animation: popUp .4s cubic-bezier(.2,1.3,.4,1) backwards; }
.ans:nth-child(2) { animation-delay: .05s; } .ans:nth-child(3) { animation-delay: .1s; } .ans:nth-child(4) { animation-delay: .15s; }
.ans:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--card); }
.ans b { flex: none; width: clamp(50px, 5.3vh, 68px); height: clamp(50px, 5.3vh, 68px); border-radius: 18px; display: grid; place-items: center; background: var(--navy); color: #fff; font-family: var(--f-title); font-weight: 700; }
.answers.locked .ans { pointer-events: none; }
.ans.picked { border-color: var(--navy); background: var(--card); }
.ans.ok { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 6px 0 var(--green-deep); }
.ans.ok b { background: #fff; color: var(--green-deep); }
.ans.bad { background: var(--wrong); border-color: var(--wrong); color: #fff; box-shadow: 0 6px 0 #a8372e; animation: shake .4s; }
.ans.bad b { background: #fff; color: #a8372e; }
.answers.revealed .ans:not(.ok):not(.bad) { opacity: .35; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }

/* ============ Resultado ============ */
.result { align-items: center; justify-content: center; text-align: center; overflow: hidden; }
.result.win { background: var(--green); color: #fff; }
.result.miss { background: var(--navy); color: #fff; }
.result .bg path { stroke: rgba(255,255,255,.09); }
.result-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2.6vh; width: 100%; max-width: 900px; }
.r-title { font-family: var(--f-title); font-weight: 800; font-size: clamp(74px, 9.5vh, 140px); line-height: .95; letter-spacing: -.03em; margin: 0; animation: bounceIn .55s cubic-bezier(.2,1.4,.4,1); }
.r-lead { margin: 0; font-size: clamp(22px, 2.5vh, 32px); font-weight: 500; }
.ticket { position: relative; background: #fff; color: var(--navy); border-radius: 28px; padding: 3vh 8vw; animation: popUp .5s .12s cubic-bezier(.2,1.3,.4,1) backwards; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; background: var(--green); }
.ticket::before { left: -20px; } .ticket::after { right: -20px; }
.ticket small { display: block; font-size: clamp(20px, 2.2vh, 28px); color: var(--blue); }
.ticket strong { display: block; font-family: var(--f-title); font-weight: 800; font-size: clamp(42px, 5.4vh, 76px); line-height: 1.05; letter-spacing: -.02em; }
.answer-box { background: #fff; color: var(--navy); border-radius: 24px; padding: 2.4vh 6vw; font-family: var(--f-title); font-weight: 700; font-size: clamp(32px, 4vh, 54px); line-height: 1.1; }
.r-explain { margin: 0; font-size: clamp(20px, 2.2vh, 28px); max-width: 30ch; opacity: .9; }
.r-actions { display: flex; flex-direction: column; gap: 2vh; width: min(80vw, 600px); margin-top: 1.5vh; }
.btn-main { min-height: clamp(80px, 8.5vh, 112px); border-radius: 24px; font-size: clamp(28px, 3.5vh, 46px); background: #fff; color: var(--navy); box-shadow: 0 7px 0 rgba(0,0,0,.18); }
.btn-main:active { box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.btn-sec { min-height: 70px; border-radius: 24px; font-size: clamp(21px, 2.4vh, 30px); background: transparent; color: #fff; box-shadow: inset 0 0 0 3px rgba(255,255,255,.75); }
.btn-sec:active { transform: none; }
.r-auto { margin: 0; font-size: clamp(16px, 1.7vh, 21px); opacity: .75; }

/* ============ Diálogos y panel del personal ============ */
dialog { border: 0; padding: 0; background: transparent; color: inherit; max-width: none; max-height: none; }
dialog::backdrop { background: rgba(15,17,50,.7); }
.pin-box { width: min(86vw, 460px); background: #fff; color: var(--navy); border-radius: 36px; padding: 32px; text-align: center; }
.pin-box h2 { font-family: var(--f-title); margin: 0 0 6px; font-size: 30px; }
.pin-box p { margin: 0 0 16px; color: var(--blue); }
.pin-dots { font-family: var(--f-title); font-weight: 800; font-size: 44px; letter-spacing: .3em; min-height: 60px; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.pad button { min-height: 76px; border: 0; border-radius: 22px; background: #eef0fa; color: var(--navy); font-family: var(--f-title); font-weight: 800; font-size: 32px; box-shadow: 0 5px 0 #c3c8e4; }
.pad button:active { transform: translateY(4px); box-shadow: 0 1px 0 #c3c8e4; }
.pin-err { color: var(--wrong); font-weight: 700; min-height: 1.4em; margin: 10px 0 0; }
.link-btn { background: none; border: 0; color: var(--blue); font-weight: 600; text-decoration: underline; padding: 14px; font-size: 18px; }

.staff { position: fixed; inset: 0; z-index: 50; background: #f3f4fb; color: var(--gray); display: flex; flex-direction: column; font-size: 17px; user-select: text; -webkit-user-select: text; }
.staff-bar { background: var(--navy); color: #fff; padding: calc(16px + env(safe-area-inset-top, 0px)) 24px 0; }
.staff-bar .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.staff-bar h2 { font-family: var(--f-title); margin: 0; font-size: 26px; }
.tabs { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; color: rgba(255,255,255,.75); padding: 14px 18px; font-weight: 600; font-size: 18px; border-radius: 14px 14px 0 0; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: #f3f4fb; color: var(--navy); }
.staff-body { flex: 1; overflow-y: auto; padding: 24px 24px calc(40px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.staff h3 { font-family: var(--f-title); color: var(--navy); margin: 26px 0 10px; font-size: 21px; }
.staff h3:first-child { margin-top: 0; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.kpi { background: #fff; border-radius: 20px; padding: 16px 18px; }
.kpi strong { display: block; font-family: var(--f-title); font-weight: 800; color: var(--navy); font-size: 38px; line-height: 1.1; }
.kpi span { color: #5d6390; font-size: 15px; }
.card { background: #fff; border-radius: 20px; padding: 16px 18px; }
.barrow { display: grid; grid-template-columns: 150px 1fr 96px; gap: 10px; align-items: center; margin: 10px 0; font-size: 15px; }
.track { height: 16px; border-radius: 99px; background: #eceef7; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.hours { display: flex; align-items: flex-end; gap: 6px; height: 180px; overflow-x: auto; padding-top: 6px; }
.hour { flex: 1; min-width: 34px; max-width: 70px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 13px; color: #5d6390; }
.hour i { width: 100%; border-radius: 8px 8px 0 0; background: var(--blue); min-height: 3px; }
.hour.peak i { background: var(--green); }
.tbl-wrap { overflow-x: auto; background: #fff; border-radius: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; color: #5d6390; font-weight: 600; background: #f8f9fd; }
th, td { padding: 10px 12px; border-bottom: 1px solid #eceef7; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td input:not([type=checkbox]), .field input, .field select, .field textarea { font: inherit; font-size: 17px; width: 100%; padding: 10px 12px; border: 2px solid #d9dcf0; border-radius: 12px; background: #fff; color: var(--gray); }
td input[type=checkbox], .check input { width: 26px; height: 26px; accent-color: var(--green); }
.pill { display: inline-block; padding: 3px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; }
.sbtn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 16px; background: var(--navy); color: #fff; }
.sbtn.ghost { background: #fff; color: var(--navy); box-shadow: inset 0 0 0 2px #d9dcf0; }
.sbtn.green { background: var(--green); }
.sbtn.danger { background: #fff; color: #b8352b; box-shadow: inset 0 0 0 2px #f1c2bd; }
.sbtn.close { background: var(--lime); color: var(--navy); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.muted { color: #5d6390; font-size: 15px; margin: 4px 0 12px; }
.q-item { background: #fff; border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; }
.q-item.off { opacity: .5; }
.q-item div { flex: 1; min-width: 0; }
.q-item p { margin: 2px 0 0; color: #5d6390; font-size: 14px; }
.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; color: var(--navy); }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--navy); }
.editor { width: min(92vw, 760px); max-height: 90vh; overflow-y: auto; background: #fff; color: var(--gray); border-radius: 28px; padding: 26px; display: flex; flex-direction: column; gap: 12px; }
.editor h2 { font-family: var(--f-title); color: var(--navy); margin: 0; }
.opt-row { display: flex; gap: 10px; align-items: center; }
.opt-row input[type=radio] { width: 28px; height: 28px; accent-color: var(--green); flex: none; }
.err { color: #b8352b; font-weight: 700; min-height: 1.2em; margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #fff; color: var(--navy); font-weight: 700; padding: 16px 26px; border-radius: 18px; z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,.3); max-width: 86vw; text-align: center; font-size: 19px; }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 40; }


@media (orientation: landscape) { .wheel { max-height: 46vw; } .headline { margin-top: 1vh; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><svg viewBox="0 0 100 150" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="var(--pattern)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 -10 C23 40 22 100 23 160"/><path d="M38 -10 L38 12 Q38 30 55 25 L118 -8"/><path d="M118 42 L80 66 Q66 75 80 85 L118 110"/><path d="M38 160 L38 126 Q38 104 58 110 L118 150"/></g></svg></div>

/* ===================== Utilidades y guardado local ===================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = () => crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem("kr." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kr." + k, JSON.stringify(v)); } catch (e) { console.warn(e); } },
  del(k) { try { localStorage.removeItem("kr." + k); } catch {} },
};
const icon = (id, color = "currentColor", size = 24) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id] || ICONS.data}</svg>`;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3800); }
const pad2 = (n) => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
let DEVICE = LS.get("device"); if (!DEVICE) { DEVICE = "tablet-" + Math.random().toString(36).slice(2, 6); LS.set("device", DEVICE); }

let cfg = normalize(LS.get("config") || DEFAULT_CONFIG);
function normalize(c) {
  const d = structuredClone(DEFAULT_CONFIG);
  return { ...d, ...c, settings: { ...d.settings, ...(c.settings || {}) }, categories: (c.categories?.length ? c.categories : d.categories).map((x) => ({ ...x, short: (x.id === "salud" && x.short === "Salud & Tec") ? "Salud y Tech" : x.short, color: (x.id === "huawei" && ["#e0393e", "#24275e"].includes(String(x.color).toLowerCase())) ? "#c7000b" : (x.id === "data" && ["#2e9bd6", "#343434"].includes(String(x.color).toLowerCase())) ? "#24275e" : x.color })), prizes: c.prizes || d.prizes, questions: c.questions || d.questions };
}

/* ===================== Datos compartidos (db) =====================
   Cada turno se guarda primero en la tablet y se envía a la base compartida
   del artifact cuando hay conexión. Las estadísticas suman todas las tablets. */
let db = null;
const remote = new Map();         // turnos confirmados en la base, por id
let knownDays = new Set();
let hist = LS.get("hist", []);    // turnos de esta tablet
let outbox = LS.get("outbox", []);      // ids pendientes de enviar
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r({ code: "timeout" }), ms))]);

function initDb() {
  if (!window.claude?.use) { setStatus(); return; }
  window.claude.use("db").then((d) => {
    db = d; if (!db) { setStatus(); return; }
    db.doc("meta/reset").onSnapshot((snap) => {
      // Si otra tablet puso todo en cero, esta también descarta sus turnos anteriores.
      const at = snap.exists ? snap.data()?.at : null;
      if (at && at !== LS.get("resetAt")) {
        LS.set("resetAt", at);
        hist = hist.filter((t) => (t.finishedAt || t.startedAt || "") > at); LS.set("hist", hist);

function nextCategory(ids) {

function openStaff() { $("#staff").hidden = false; renderTab(); loadRemote().then(() => { if (!$("#staff").hidden && tab === "resumen") renderTab(); }); }
$("#staff-close").onclick = () => { $("#staff").hidden = true; };
$("#tabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; [...$("#tabs").children].forEach((x) => x.setAttribute("aria-selected", x === b)); renderTab(); };
const catBy = (id) => cfg.categories.find((c) => c.id === id) || { name: id, color: "#999", ink: "#fff" };
const pct = (a, b) => (b ? Math.round(100 * a / b) + "%" : "–");

function renderTab() {
  const body = $("#staff-body");
  if (tab === "resumen") {
    const T = allTurns().filter((t) => t.finishedAt);
    const ok = T.filter((t) => t.correct).length, won = T.filter((t) => t.correct).length, del = T.filter((t) => t.delivered).length;
    const byCat = cfg.categories.map((c) => { const x = T.filter((t) => t.category === c.id); return { c, n: x.length, ok: x.filter((t) => t.correct).length }; });
    const maxC = Math.max(1, ...byCat.map((x) => x.n));
    const hours = {}; for (const t of T) { const d = new Date(t.finishedAt); const k = `${dayKey(d)} ${pad2(d.getHours())}`; hours[k] = (hours[k] || 0) + 1; }
    const hk = Object.keys(hours).sort(); const maxH = Math.max(1, ...Object.values(hours));
    const byQ = {}; for (const t of T) { const q = byQ[t.questionId] ||= { text: t.questionText, cat: t.category, n: 0, ok: 0 }; q.n++; if (t.correct) q.ok++; }
    const hard = Object.values(byQ).filter((q) => q.n >= 1).sort((a, b) => a.ok / a.n - b.ok / b.n).slice(0, 8);
    const multiDay = new Set(hk.map((k) => k.slice(0, 10))).size > 1;
    body.innerHTML = `
      <h3>Resumen del evento</h3>
      <div class="kpis">
        <div class="kpi"><strong>${T.length}</strong><span>Turnos jugados</span></div>
        <div class="kpi"><strong>${pct(ok, T.length)}</strong><span>Respuestas correctas (${ok})</span></div>
        <div class="kpi"><strong>${del} / ${won}</strong><span>Premios entregados / ganados</span></div>
        <div class="kpi"><strong>${hk.length ? hk.reduce((a, b) => hours[a] >= hours[b] ? a : b).slice(-2) + " h" : "–"}</strong><span>Hora pico</span></div>
      </div>
      <h3>Turnos por hora</h3>
      <div class="card"><div class="hours">${hk.length ? hk.map((k) => `<div class="hour ${hours[k] === maxH ? "peak" : ""}"><span>${hours[k]}</span><i style="height:${100 * hours[k] / maxH}%"></i><span>${multiDay ? k.slice(8, 10) + "/" + k.slice(5, 7) + " " : ""}${k.slice(-2)}h</span></div>`).join("") : '<p class="muted">Todavía no hay turnos.</p>'}</div></div>
      <h3>Por categoría</h3>
      <div class="card">${byCat.map((x) => `<div class="barrow"><span>${esc(x.c.name)}</span><div class="track"><div class="fill" style="width:${100 * x.n / maxC}%;background:${esc(x.c.color)}"></div></div><span class="num">${x.n} · ${pct(x.ok, x.n)}</span></div>`).join("")}</div>
      <h3>Preguntas más difíciles</h3>
      <div class="tbl-wrap"><table><tr><th>Pregunta</th><th>Turnos</th><th>Acierto</th></tr>${hard.map((q) => `<tr><td>${esc(q.text)}</td><td class="num">${q.n}</td><td class="num">${pct(q.ok, q.n)}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">Sin datos todavía.</td></tr>'}</table></div>
      <p class="muted">${db ? "Incluye los turnos de todas las tablets que usan esta ruleta." : "Modo local: solo turnos de esta tablet."}</p>`;
  }
  if (tab === "premios") {
    const P = prizesWithStock(); const T = allTurns();
    body.innerHTML = `<h3>Premios y stock</h3>
      <p class="muted">Peso = probabilidad relativa entre premios con stock. Con peso 50 y 1, el segundo sale 1 de cada 51 aciertos.</p>
      <div class="tbl-wrap"><table><tr><th>Premio</th><th>Stock total</th><th>Peso</th><th>Activo</th><th>Ganados</th><th>Entregados</th><th>Quedan</th></tr>
      ${P.map((p, i) => `<tr data-i="${i}"><td><input data-k="name" value="${esc(p.name)}" style="min-width:210px"></td><td><input data-k="stock" type="number" min="0" inputmode="numeric" value="${p.stock}" style="width:90px"></td><td><input data-k="weight" type="number" min="1" inputmode="numeric" value="${p.weight}" style="width:80px"></td><td><input data-k="active" type="checkbox" ${p.active !== false ? "checked" : ""}></td><td class="num">${p.awarded}</td><td class="num">${T.filter((t) => t.prizeId === p.id && t.delivered).length}</td><td class="num"><strong>${p.remaining}</strong></td></tr>`).join("")}
      </table></div>
      <div class="actions"><button class="sbtn ghost" id="p-add">Agregar premio</button><button class="sbtn green" id="p-save">Guardar premios</button></div>
      <label class="field" style="max-width:420px">Premio si se agota todo el stock<input id="p-fallback" value="${esc(cfg.settings.fallbackPrize)}"></label>`;
    body.querySelectorAll("tr[data-i] input").forEach((inp) => inp.oninput = inp.onchange = () => { const p = cfg.prizes[inp.closest("tr").dataset.i]; const k = inp.dataset.k; p[k] = inp.type === "checkbox" ? inp.checked : inp.type === "number" ? +inp.value : inp.value; });
    $("#p-add").onclick = () => { cfg.prizes.push({ id: "premio-" + Math.random().toString(36).slice(2, 6), name: "Nuevo premio", stock: 10, weight: 5, active: true }); renderTab(); };
    $("#p-save").onclick = () => { cfg.settings.fallbackPrize = $("#p-fallback").value.trim(); saveConfig(); renderTab(); };
  }
  if (tab === "preguntas") {
    body.innerHTML = `<h3>Banco de preguntas</h3>
      <p class="muted">${cfg.categories.map((c) => `${esc(c.name)}: ${cfg.questions.filter((q) => q.category === c.id && q.active !== false).length}`).join(" · ")} activas. Recomendado: 6 o más por categoría.</p>
      <div class="actions"><button class="sbtn green" id="q-new">Nueva pregunta</button></div>
      ${cfg.categories.map((c) => `<h3 style="color:${esc(c.color)}">${esc(c.name)}</h3>` + cfg.questions.filter((q) => q.category === c.id).map((q) => `
        <div class="q-item ${q.active === false ? "off" : ""}"><div><strong>${esc(q.text)}</strong><p>✓ ${esc(q.options[q.correct])}${q.active === false ? " · desactivada" : ""}</p></div>
        <button class="sbtn ghost" data-edit="${esc(q.id)}">Editar</button><button class="sbtn danger" data-del="${esc(q.id)}">Borrar</button></div>`).join("")).join("")}`;
    $("#q-new").onclick = () => editQuestion(null);
    body.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editQuestion(cfg.questions.find((q) => q.id === b.dataset.edit)));
    body.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => { if (await askConfirm("¿Borrar esta pregunta?", "Deja de salir en la ruleta. Las participaciones ya registradas no se borran.", "Sí, borrar")) { cfg.questions = cfg.questions.filter((q) => q.id !== b.dataset.del); saveConfig(); renderTab(); } });
  }
  if (tab === "ajustes") {
    const s = cfg.settings;
    body.innerHTML = `<h3>Ajustes</h3><div class="settings">
      <label class="field">Tiempo para responder (segundos, 0 = sin límite)<input id="s-q" type="number" min="0" max="120" inputmode="numeric" value="${s.questionSec}"></label>
      <label class="field">Duración del giro (segundos)<input id="s-spin" type="number" min="2" max="12" step="0.5" inputmode="decimal" value="${s.spinMs / 1000}"></label>
      <label class="field">Cierre automático del resultado (segundos)<input id="s-r" type="number" min="10" max="300" inputmode="numeric" value="${s.resultSec}"></label>
      <label class="field">PIN del personal (4 a 8 números)<input id="s-pin" inputmode="numeric" value="${esc(s.pin)}"></label>
      <label class="check"><input id="s-sound" type="checkbox" ${soundOn ? "checked" : ""}> Sonido activado en esta tablet</label>
      </div><div class="actions"><button class="sbtn green" id="s-save">Guardar ajustes</button></div>
      <h3>Categorías</h3><div class="tbl-wrap"><table><tr><th>Nombre</th><th>Nombre en la ruleta</th><th>Color</th></tr>
      ${cfg.categories.map((c, i) => `<tr data-i="${i}"><td><input data-k="name" value="${esc(c.name)}"></td><td><input data-k="short" maxlength="13" value="${esc(c.short)}"></td><td><input data-k="color" type="color" value="${esc(c.color)}" style="width:64px;height:44px;padding:2px"></td></tr>`).join("")}</table></div>`;
    body.querySelectorAll("tr[data-i] input").forEach((inp) => inp.oninput = () => { cfg.categories[inp.closest("tr").dataset.i][inp.dataset.k] = inp.value; });
    $("#s-save").onclick = () => {
      const p = $("#s-pin").value.trim(); if (!/^\d{4,8}$/.test(p)) { toast("El PIN debe tener entre 4 y 8 números."); return; }
      Object.assign(s, { questionSec: Math.max(0, +$("#s-q").value || 0), spinMs: Math.round(Math.min(12, Math.max(2, +$("#s-spin").value || 5)) * 1000), resultSec: Math.max(10, +$("#s-r").value || 30), pin: p });
      soundOn = $("#s-sound").checked; LS.set("sound", soundOn); renderSoundBtn(); saveConfig();
    };
  }
  if (tab === "datos") {
    const T = allTurns();
    body.innerHTML = `<h3>Datos</h3>
      <div class="kpis"><div class="kpi"><strong>${outbox.length}</strong><span>Turnos por enviar desde esta tablet</span></div><div class="kpi"><strong>${T.length}</strong><span>Turnos registrados en total</span></div></div>
      <div class="actions"><button class="sbtn" id="d-sync">Sincronizar ahora</button><button class="sbtn green" id="d-csv">Descargar participaciones (CSV para Excel)</button></div>
      <p class="muted">${db ? "Conectado a la base compartida de la ruleta." : "Modo local: abrí la ruleta desde su link de Claude para compartir datos entre tablets."} Tablet: ${esc(DEVICE)}.</p>
      <h3>Antes de abrir el stand</h3>
      <p class="muted">Borrá los turnos de prueba para que las estadísticas y el stock arranquen de cero. Las preguntas y premios no se borran.</p>
      <div class="actions"><button class="sbtn danger" id="d-reset">Borrar todos los turnos</button></div>`;
    $("#d-sync").onclick = async () => { await flush(); await loadRemote(); toast(outbox.length ? "Sin conexión: los turnos siguen guardados en la tablet." : "Todo sincronizado."); renderTab(); };
    $("#d-csv").onclick = exportCsv;
    $("#d-reset").onclick = resetTurns;
  }
}
function editQuestion(q) {
  const f = $("#q-form"); f.reset(); $("#q-err").textContent = "";
  f.category.innerHTML = cfg.categories.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  $("#q-form-title").textContent = q ? "Editar pregunta" : "Nueva pregunta";
  if (q) { f.category.value = q.category; f.text.value = q.text; f.explanation.value = q.explanation || ""; f.active.checked = q.active !== false; q.options.forEach((o, i) => f["o" + i].value = o); f.querySelector(`[name=correct][value="${q.correct}"]`).checked = true; }
  else f.active.checked = true;
  f.dataset.id = q?.id || ""; $("#dlg-q").showModal();
}
$("#q-cancel").onclick = () => $("#dlg-q").close();
$("#q-form").onsubmit = (e) => {
  e.preventDefault(); const f = e.target;
  const opts = [0, 1, 2, 3].map((i) => f["o" + i].value.trim());
  const ci = +(f.querySelector("[name=correct]:checked")?.value ?? -1);
  if (!f.text.value.trim()) return $("#q-err").textContent = "Escribí la pregunta.";
  if (opts.filter(Boolean).length < 2) return $("#q-err").textContent = "Completá al menos dos opciones.";
  if (ci < 0 || !opts[ci]) return $("#q-err").textContent = "Marcá cuál es la opción correcta.";
  const kept = opts.map((t, i) => ({ t, i })).filter((o) => o.t);
  const data = { id: f.dataset.id || f.category.value + "-" + Math.random().toString(36).slice(2, 7), category: f.category.value, text: f.text.value.trim(), options: kept.map((o) => o.t), correct: kept.findIndex((o) => o.i === ci), explanation: f.explanation.value.trim(), active: f.active.checked };
  const i = cfg.questions.findIndex((x) => x.id === data.id);
  if (i >= 0) cfg.questions[i] = data; else cfg.questions.push(data);
  $("#dlg-q").close(); saveConfig(); renderTab();
};
async function exportCsv() {
  const rows = allTurns().filter((t) => t.finishedAt).sort((a, b) => a.finishedAt.localeCompare(b.finishedAt));
  const head = ["fecha", "hora", "categoria", "pregunta", "respuesta", "resultado", "premio", "entregado", "tablet"];
  const cell = (v) => { const s = String(v ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = rows.map((t) => { const d = new Date(t.finishedAt); return [dayKey(d), `${pad2(d.getHours())}:${pad2(d.getMinutes())}`, t.categoryName || catBy(t.category).name, t.questionText, t.answerIndex === null ? "(sin respuesta)" : t.answerText, t.correct ? "correcta" : "incorrecta", t.prizeName, t.correct ? (t.delivered ? "si" : "no") : "", t.device].map(cell).join(";"); });
  const csv = "\uFEFF" + [head.join(";"), ...lines].join("\r\n");
  const dl = window.claude?.use ? await window.claude.use("downloads") : null;
  if (!dl) { toast("La descarga funciona al abrir la ruleta desde su link de Claude."); return; }
  try { await dl.save({ filename: `ruleta-kunan-${dayKey()}.csv`, data: csv }); } catch (e) { if (e?.code !== "declined") toast("No se pudo descargar el archivo."); }
}
// Confirmación dentro de la página (las ventanas del navegador están bloqueadas en la página publicada).
function askConfirm(title, text, okLabel) {
  return new Promise((resolve) => {
    const d = $("#dlg-confirm");
    $("#cf-title").textContent = title; $("#cf-text").textContent = text; $("#cf-yes").textContent = okLabel;
    const done = (v) => { if (d.open) d.close(); resolve(v); };
    $("#cf-yes").onclick = () => done(true); $("#cf-no").onclick = () => done(false);
    d.oncancel = (e) => { e.preventDefault(); done(false); };
    d.showModal();
  });
}
async function resetTurns() {
  const ok = await askConfirm("¿Poner todo en cero?", "Se borran todas las participaciones de todas las tablets. Las estadísticas y el stock de premios vuelven a cero. Las preguntas, los premios y los ajustes no se tocan.", "Sí, borrar todo");
  if (!ok) return;
  const btn = $("#d-reset"); if (btn) { btn.disabled = true; btn.textContent = "Borrando…"; }
  const at = new Date().toISOString();
  LS.set("resetAt", at); LS.del("active");
  hist = []; outbox = []; LS.set("hist", []); LS.set("outbox", []);
  if (!db) { remote.clear(); toast("Listo: todo volvió a cero en esta tablet."); renderTab(); return; }
  try {
    for (let pass = 0; pass < 3; pass++) {
      remote.clear(); await loadRemote();
      if (!online) throw new Error("sin conexión");
      if (!remote.size && !knownDays.size) break;
      for (const t of [...remote.values()]) { await withTimeout(db.doc(`days/${t.day}/turns/${t.id}`).delete(), 15000); remote.delete(t.id); }
      for (const d of [...knownDays]) { await withTimeout(db.doc(`days/${d}`).delete(), 15000); knownDays.delete(d); }
    }
    await withTimeout(db.doc("meta/reset").set({ at }), 15000);
    remote.clear(); knownDays.clear();
    toast("Listo: todo volvió a cero.");
  } catch { toast("Sin conexión: se borró solo en esta tablet. Repetí con internet para borrar todo."); }
  renderTab();
}

/* ===================== Arranque ===================== */
function applyConfig() { if (!W.spinning) { buildWheel(); if (phase === "idle") idleStart(); } }
buildWheel(); idleStart(); renderSoundBtn(); setStatus(); initDb();
window.addEventListener("online", () => { online = true; flush(); });
window.addEventListener("offline", setStatus);
document.addEventListener("contextmenu", (e) => e.preventDefault());
(async () => { try { await navigator.wakeLock?.request("screen"); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") navigator.wakeLock?.request("screen").catch(() => {}); }); } catch {} })();
// Si la tablet se reinició con un premio en pantalla, se vuelve a mostrar.
(() => { const a = LS.get("active"); if (a?.finishedAt) { turn = a; question = cfg.questions.find((q) => q.id === a.questionId); cat = catBy(a.category); if (question) showResult(); else LS.del("active"); } })();
</script>
